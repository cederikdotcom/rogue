<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rogue</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0d0d;
    color: #ccc;
    font-family: monospace;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    touch-action: manipulation;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 0.3rem 0.75rem;
    justify-content: center;
  }
  h1 { font-size: 0.9rem; font-weight: normal; letter-spacing: 0.3em; margin: 0; }
  #status { font-size: 0.7rem; color: #888; }
  #who {
    font-size: 0.75rem;
    color: #9c9;
    cursor: pointer;
    text-decoration: underline dotted #575;
  }
  header a { font-size: 0.7rem; color: #9c9; }

  #main {
    flex: 1;
    display: grid;
    grid-template-areas: "term";
    min-height: 0;
  }
  body.touch #main {
    grid-template-areas: "term term" "dpad actions";
    grid-template-rows: 1fr auto;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    padding: 0 0.6rem calc(0.6rem + env(safe-area-inset-bottom));
  }
  /* landscape: controls flank the terminal */
  @media (orientation: landscape) {
    body.touch #main {
      grid-template-areas: "dpad term actions";
      grid-template-rows: 1fr;
      grid-template-columns: auto 1fr auto;
      padding: 0 calc(0.4rem + env(safe-area-inset-left)) 0.4rem
                 calc(0.4rem + env(safe-area-inset-right));
    }
  }

  #termwrap {
    grid-area: term;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }
  #term { background: #000; border-radius: 6px; padding: 3px; }

  #dpad, #actions { display: none; }
  body.touch #dpad {
    display: grid;
    grid-area: dpad;
    grid-template-columns: repeat(3, var(--pad, 3.2rem));
    grid-template-rows: repeat(3, var(--pad, 3.2rem));
    gap: 0.3rem;
    justify-self: start;
    align-self: end;
  }
  body.touch #actions {
    display: grid;
    grid-area: actions;
    grid-template-columns: repeat(3, var(--act, 3rem));
    grid-auto-rows: 2.5rem;
    gap: 0.3rem;
    justify-self: end;
    align-self: end;
  }
  @media (orientation: landscape) {
    body.touch #dpad, body.touch #actions { align-self: center; }
    body.touch #dpad { --pad: 2.9rem; }
    body.touch #actions { --act: 2.7rem; grid-auto-rows: 2.2rem; }
  }
  #actions .wide { grid-column: span 3; }
  button {
    font-family: monospace;
    font-size: 1.15rem;
    color: #ddd;
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 0.5rem;
    padding: 0;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  button:active { background: #3a3a3a; }
  #dpad button { color: #9c9; }
  #actions button { color: #cc9; font-size: 0.9rem; }

  #kbdbar {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    gap: 0.4rem;
    padding: 0.5rem calc(0.6rem + env(safe-area-inset-left))
             calc(0.5rem + env(safe-area-inset-bottom))
             calc(0.6rem + env(safe-area-inset-right));
    background: #161616;
    border-top: 1px solid #333;
  }
  #kbdbar.open { display: flex; }
  #kbdbar input {
    flex: 1;
    font-family: monospace;
    font-size: 1rem;
    color: #ddd;
    background: #000;
    border: 1px solid #333;
    border-radius: 0.4rem;
    padding: 0.5rem 0.6rem;
  }
  #kbdbar button { padding: 0 1rem; font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <h1>ROGUE</h1>
  <div id="who"></div>
  <div id="status">connecting...</div>
  <a href="/help">help</a>
  <a href="/scores">scores</a>
  <a href="https://github.com/cederikdotcom/rogue">source</a>
</header>
<div id="main">
  <div id="termwrap"><div id="term"></div></div>
  <div id="dpad">
    <button data-key="y">y</button>
    <button data-key="k">k</button>
    <button data-key="u">u</button>
    <button data-key="h">h</button>
    <button data-key="." title="rest">.</button>
    <button data-key="l">l</button>
    <button data-key="b">b</button>
    <button data-key="j">j</button>
    <button data-key="n">n</button>
  </div>
  <div id="actions">
    <button data-key=" " class="wide">space</button>
    <button data-key="i">i</button>
    <button data-key="s">s</button>
    <button data-key="&gt;">&gt;</button>
    <button data-key="e">e</button>
    <button data-key="q">q</button>
    <button data-key="r">r</button>
    <button data-key="w">w</button>
    <button data-key="?">?</button>
    <button data-key="&#27;">esc</button>
    <button data-key="*">*</button>
    <button data-key="&lt;">&lt;</button>
    <button data-key="z">z</button>
    <button id="kbd" class="wide">keyboard</button>
  </div>
</div>
<form id="kbdbar">
  <input id="kbdinput" autocapitalize="off" autocomplete="off" autocorrect="off"
         spellcheck="false" placeholder="type, then send">
  <button type="submit">send</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script>
  const COLS = 80, ROWS = 24;
  const touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window
    || new URLSearchParams(location.search).has('touch');
  if (touch) document.body.classList.add('touch');

  // character width/height ratios of the monospace font, per px of font size
  function charRatios() {
    const probe = document.createElement('span');
    probe.style.cssText = 'font-family:monospace;font-size:100px;position:absolute;visibility:hidden';
    probe.textContent = 'M';
    document.body.appendChild(probe);
    const r = probe.getBoundingClientRect();
    probe.remove();
    return { w: r.width / 100, h: r.height / 100 };
  }
  const ratio = charRatios();

  // Pick a font size so the 80x24 grid fits the terminal area.
  function fontSize() {
    const box = document.getElementById('termwrap').getBoundingClientRect();
    const fitW = (box.width - 12) / (COLS * ratio.w);
    const fitH = (box.height - 12) / (ROWS * ratio.h);
    return Math.max(5, Math.min(18, fitW, fitH));
  }

  const status = document.getElementById('status');
  const term = new Terminal({
    cols: COLS,
    rows: ROWS,
    cursorBlink: true,
    fontSize: fontSize(),
    theme: { background: '#000000' }
  });
  term.open(document.getElementById('term'));
  addEventListener('resize', () => { term.options.fontSize = fontSize(); });
  if (!touch) term.focus();

  // The player id doubles as the identity you can write down and
  // type on another device to pick up your save: wren-the-sly-4721.
  // The name part also becomes the in-game name.
  let pid = localStorage.getItem('rogue-id');
  if (!pid) {
    const first = ['alda', 'bran', 'cora', 'dorn', 'edda', 'finn', 'greta', 'hild',
      'ivo', 'jora', 'kell', 'lira', 'mord', 'nix', 'orla', 'pike', 'quill', 'rook',
      'sable', 'tobin', 'una', 'vex', 'wren', 'yara', 'zed'];
    const epithet = ['bold', 'sly', 'grim', 'swift', 'lucky', 'wary', 'fey', 'dour',
      'keen', 'rash', 'stout', 'quiet', 'cursed', 'bright', 'meek', 'vile'];
    // keep the name a previous version rolled, if there is one
    const legacy = localStorage.getItem('rogue-name');
    const base = legacy && /^[A-Za-z ]{1,24}$/.test(legacy)
      ? legacy.toLowerCase().replaceAll(' ', '-')
      : first[Math.floor(Math.random() * first.length)] + '-the-'
        + epithet[Math.floor(Math.random() * epithet.length)];
    pid = base + '-' + (1000 + Math.floor(Math.random() * 9000));
    localStorage.setItem('rogue-id', pid);
  }

  function idToName(id) {
    const parts = id.split('-');
    if (/^\d+$/.test(parts[parts.length - 1])) parts.pop();
    return parts.map((w) => w === 'the' ? 'the' : w.charAt(0).toUpperCase() + w.slice(1))
      .join(' ').slice(0, 32);
  }
  const name = idToName(pid);

  const who = document.getElementById('who');
  who.textContent = pid;
  who.addEventListener('click', () => {
    const answer = prompt(
      'Your id is:\n\n    ' + pid + '\n\n'
      + 'Write it down. Type it on any device to continue your saved game there.\n'
      + 'To switch to another id, type it below:', pid);
    if (answer === null) return;
    const norm = answer.trim().toLowerCase().replace(/#/g, '').replace(/\s+/g, '-');
    if (norm === pid || !/^[a-z0-9-]{1,64}$/.test(norm)) return;
    localStorage.setItem('rogue-id', norm);
    location.reload();
  });

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(proto + '://' + location.host + '/ws?p=' + pid
    + '&name=' + encodeURIComponent(name));
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    status.textContent = touch ? 'connected.' : 'connected. hjkl or arrows to move, i inventory, Q quit.';
  };
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      // control message from the server, not terminal bytes
      try {
        if (JSON.parse(e.data).restored) {
          status.textContent = 'save restored and used up. press S to save again.';
          status.style.color = '#cc9';
        }
      } catch (_) {}
      return;
    }
    term.write(new Uint8Array(e.data));
  };
  ws.onclose = () => {
    status.textContent = 'game over or saved. tap here to continue.';
    status.style.cssText = 'color:#9c9;cursor:pointer;text-decoration:underline';
    status.addEventListener('click', () => location.reload());
  };
  ws.onerror = () => { status.textContent = 'connection error.'; };

  function send(d) {
    if (ws.readyState === WebSocket.OPEN) ws.send(d);
  }
  term.onData(send);

  // Touch buttons: tap sends one key, holding a direction repeats it.
  document.querySelectorAll('#main button[data-key]').forEach((btn) => {
    const key = btn.dataset.key;
    const repeatable = 'hjklyubn'.includes(key);
    let timer = null, interval = null;
    const start = (ev) => {
      ev.preventDefault();
      send(key);
      if (repeatable) {
        timer = setTimeout(() => {
          interval = setInterval(() => send(key), 130);
        }, 350);
      }
    };
    const stop = () => {
      clearTimeout(timer);
      clearInterval(interval);
      timer = interval = null;
    };
    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', stop);
    btn.addEventListener('touchcancel', stop);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', stop);
    btn.addEventListener('mouseleave', stop);
  });

  // keyboard: a real input bar, because focusing the hidden xterm
  // textarea does not reliably open the keyboard on phones.
  const kbdbar = document.getElementById('kbdbar');
  const kbdinput = document.getElementById('kbdinput');
  document.getElementById('kbd').addEventListener('click', () => {
    kbdbar.classList.toggle('open');
    if (kbdbar.classList.contains('open')) kbdinput.focus();
  });
  kbdbar.addEventListener('submit', (ev) => {
    ev.preventDefault();
    send(kbdinput.value + '\r');
    kbdinput.value = '';
    kbdbar.classList.remove('open');
    kbdinput.blur();
  });
</script>
</body>
</html>
