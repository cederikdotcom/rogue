name: Publish scale image

# Build the rogue OCI image for the Hydra fleet and push it to the scale
# registry. Tag a version (v1.2.3) to trigger it. Deploying the pushed image
# onto a node is a separate manual step (see docs/runbooks/deploy-hydra.md).

on:
  push:
    tags:
      - 'v*'

jobs:
  image:
    name: Publish OCI image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the scale registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.SCALE_REGISTRY }}
          username: ${{ vars.SCALE_REGISTRY_USER }}
          password: ${{ secrets.SCALE_REGISTRY_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is not optional: the Pi fleet is arm64 and a single-arch
          # amd64 image cannot be scheduled there at all.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.SCALE_REGISTRY }}/rogue:${{ steps.get_version.outputs.version }}
            ${{ vars.SCALE_REGISTRY }}/rogue:latest

      - name: Verify both architectures are present
        run: |
          REG=${{ vars.SCALE_REGISTRY }}
          docker buildx imagetools inspect "$REG/rogue:${{ steps.get_version.outputs.version }}" | tee /tmp/manifest.txt
          for arch in amd64 arm64; do
            grep -q "linux/$arch" /tmp/manifest.txt || { echo "missing linux/$arch"; exit 1; }
          done
