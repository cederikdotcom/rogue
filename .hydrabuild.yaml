# .hydrabuild.yaml — rogue's scale-deploy intent for the git-push-to-deploy
# pipeline (issue #492).
#
# hydragitwatcher reads this file from the root of the tagged commit. On a
# `v*` tag push it builds the Dockerfile below multi-arch on the federated
# BuildKit builder, pushes the image to the scale registry, then launches (or
# `hydraskin update`s) the scale on a node and applies the labels below.
# A plain branch push builds and pushes the image only — no deploy.
#
# This file only DECLARES intent. It changes neither the game nor the image.
# The existing Dockerfile and .github/workflows/deploy-image.yml remain the
# source of truth for how the image is built; this is what the watcher reads
# to know WHERE and HOW to run it once built.

scale:
  # Scale (Incus instance) name. Also the registry repository name:
  #   scaleregistry.experiencenet.com/rogue:<tag>
  name: rogue

  # The domain hydrascalerouter serves, set as user.hydra.domain on the scale.
  # DNS is an explicit A record rogue.experiencenet.com -> 141.227.136.199 (the
  # edge), created BEFORE the scale is routed so Traefik's first ACME attempt
  # does not hit NXDOMAIN. There is no *.experiencenet.com wildcard.
  domain: rogue.experiencenet.com

  # Plain HTTP port inside the container (rogue-web binds :8080). TLS is
  # terminated upstream by hydrascalerouter. Set as user.hydra.port.
  port: 8080

  # Health check path, set as user.hydra.health_path. rogue-web has no
  # /api/v1/health endpoint; it serves /, /help, /scores and /ws. `/` returns
  # 200 from the static file server, so `/` is the health signal.
  health_path: /

  # Persistent game state (save files, score and lock files). Attached as an
  # Incus disk device at launch and mounted at path; never baked into the
  # image (the Dockerfile deliberately declares no VOLUME).
  disk:
    path: /data
    size: 2GiB

# Target set: WHERE this one image is deployed. A git push builds a single OCI
# image; deploy maps that image onto the target set. The default is one scale on
# one node. A `group` load-balances several members behind one shared domain; a
# `fanout` runs one member per district, each on its own domain. The schema
# matches hydragitwatcher's buildconfig Target type (name/node/domain/disk).
targets:
  - name: rogue                 # single default; one scale on one node
    node: node-50ab5309         # arm64 hydraskin node
    domain: rogue.experiencenet.com
# group example (load-balanced behind one shared domain):
#   kind: group
#   domain: rogue.experiencenet.com
#   members:
#     - {name: rogue-a, node: node-50ab5309}
#     - {name: rogue-b, node: hydraskin-perforce-1}
# fanout example (per-district, one domain each):
#   kind: fanout
#   members:
#     - {name: rogue-bxl1, node: node-50ab5309, domain: rogue-bxl1.experiencenet.com}

build:
  # Relative to the repository root (the fetched build context).
  dockerfile: Dockerfile
  context: .
  # Both arches are required: the Pi fleet is arm64 and the hcloud nodes are
  # amd64. Each is built natively by its own buildkitd daemon — no QEMU.
  platforms:
    - linux/amd64
    - linux/arm64
